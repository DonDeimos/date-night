<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Eine kleine Einladung …</title>

<!--
  ============================================================
   DATE-EINLADUNG  ·  Single-Page-App  ·  index.html
  ============================================================
   Alles (HTML + CSS + JS) steckt in DIESER einen Datei.
   Direkt auf GitHub Pages hochladbar.

   👉 SCHNELL ANPASSEN (alles im <script>-Block ganz unten):
      • KONFIG  -> Datum, Finale-Texte, Belohnung
      • FRAGEN  -> Fragen, Optionen & welche Tierchen je Seite (szene)
      • TIERE   -> die Kawaii-Tierchen (eigene Inline-SVGs, Farben/Props)
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />

<style>
  /* ============================================================
     1) DESIGN-TOKENS  –  Farben/Look zentral ändern
     ============================================================ */
  :root {
    --creme:        #fdf6ec;
    --creme-2:      #f7ecd9;
    --terrakotta:   #d8744f;
    --terrakotta-d: #b9543a;
    --petrol:       #3f7d78;
    --petrol-d:     #2f5f5b;
    --tinte:        #45382f;
    --tinte-soft:   #6e5f53;
    --schatten:     0 18px 50px -18px rgba(69, 56, 47, .45);
    --radius:       26px;
    --max-breite:   560px;
  }

  /* ============================================================
     2) GRUNDLAYOUT  –  Mobile-First
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Fraunces", Georgia, serif;
    color: var(--tinte);
    background:
      radial-gradient(circle at 15% 12%, rgba(216,116,79,.16), transparent 42%),
      radial-gradient(circle at 85% 88%, rgba(63,125,120,.16), transparent 45%),
      var(--creme);
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 22px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(69,56,47,.05) 1px, transparent 1px);
    background-size: 22px 22px; z-index: 0;
  }

  /* ============================================================
     3) KARTE
     ============================================================ */
  .karte {
    position: relative; z-index: 1;
    width: 100%; max-width: var(--max-breite);
    background: linear-gradient(180deg, #fffdf9, var(--creme-2));
    border: 1px solid rgba(69,56,47,.08);
    border-radius: var(--radius);
    box-shadow: var(--schatten);
    padding: 34px 26px 30px;
    overflow: hidden;
  }
  .karte::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, var(--terrakotta), #f0c987, var(--petrol));
  }

  /* ============================================================
     4) FORTSCHRITTS-PUNKTE
     ============================================================ */
  .fortschritt { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .punkt {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(69,56,47,.16); transition: all .4s ease;
  }
  .punkt.aktiv  { background: var(--terrakotta); transform: scale(1.25); }
  .punkt.fertig { background: var(--petrol); }

  /* ============================================================
     5) TIER-SZENE  (2–3 Kawaii-Tierchen pro Seite)
     ============================================================ */
  .szene {
    display: flex; justify-content: center; align-items: flex-end;
    gap: 5px; margin: 2px 0 16px; min-height: 74px; flex-wrap: nowrap;
  }
  .tier {
    width: 62px; height: auto; flex: 0 0 auto;
    pointer-events: none;                 /* blockiert nie die Buttons */
    filter: drop-shadow(0 6px 6px rgba(69,56,47,.18));
    transform-origin: center bottom;
    animation: bob 3.2s ease-in-out infinite;
  }
  .tier.vase { width: 58px; animation-duration: 4s; }
  /* leichtes „Verteilen" durch versetzte Höhe + Neigung */
  .szene .tier:nth-child(1) { --r: -4deg; animation-delay: 0s;  align-self: flex-start; }
  .szene .tier:nth-child(2) { --r:  3deg; animation-delay: .5s; }
  .szene .tier:nth-child(3) { --r: -2deg; animation-delay: 1s;  align-self: flex-start; }
  @keyframes bob {
    0%,100% { transform: translateY(0)    rotate(var(--r, 0deg)); }
    50%     { transform: translateY(-6px) rotate(var(--r, 0deg)); }
  }

  /* ============================================================
     6) STEP / FRAGE  +  Fading
     ============================================================ */
  .step { display: none; }
  .step.sichtbar { display: block; }
  @keyframes einblenden {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .step.sichtbar { animation: einblenden .5s cubic-bezier(.22,.61,.36,1) both; }

  .augenbraue {
    font-family: "Caveat", cursive; font-size: 1.35rem;
    color: var(--terrakotta-d); text-align: center; margin-bottom: 6px;
  }
  .frage {
    font-size: 1.5rem; line-height: 1.32; font-weight: 600;
    text-align: center; text-wrap: balance; margin-bottom: 24px;
  }

  /* ============================================================
     7) ANTWORT-BUTTONS
     ============================================================ */
  .optionen { display: flex; flex-direction: column; gap: 12px; }
  .option {
    font-family: inherit; font-size: 1.05rem; font-weight: 500;
    color: var(--tinte); text-align: left; background: #fffdf9;
    border: 1.5px solid rgba(69,56,47,.14); border-radius: 16px;
    padding: 16px 18px; cursor: pointer;
    transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .option:hover {
    border-color: var(--terrakotta);
    box-shadow: 0 8px 22px -10px rgba(216,116,79,.55);
    transform: translateY(-2px);
  }
  .option:active { transform: translateY(0) scale(.99); }

  /* ============================================================
     8) FINALE
     ============================================================ */
  .finale { text-align: center; }
  .finale h1 {
    font-family: "Fraunces", serif; font-weight: 600; font-size: 1.7rem;
    line-height: 1.3; text-wrap: balance; margin-bottom: 10px;
  }
  .finale .wahl { color: var(--terrakotta-d); font-style: italic; }
  .finale .datum {
    display: inline-block; margin: 14px 0 24px;
    font-family: "Caveat", cursive; font-size: 1.5rem; color: var(--petrol-d);
  }
  .ja-button {
    font-family: inherit; font-size: 1.3rem; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--terrakotta), var(--terrakotta-d));
    border: none; border-radius: 18px; padding: 18px 54px; cursor: pointer;
    box-shadow: 0 14px 30px -10px rgba(185,84,58,.7);
    transition: transform .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .ja-button:hover { transform: translateY(-3px) scale(1.03); }
  .ja-button:active { transform: translateY(0) scale(.98); }

  .belohnung { text-align: center; }
  .belohnung h2 { font-weight: 600; font-size: 1.6rem; margin-bottom: 12px; text-wrap: balance; }
  .belohnung p { color: var(--tinte-soft); font-size: 1.08rem; line-height: 1.5; text-wrap: balance; }
  .gutschein {
    margin-top: 22px; border: 2px dashed var(--petrol); border-radius: 16px;
    padding: 16px 18px; background: rgba(63,125,120,.10);
    font-family: "Caveat", cursive; font-size: 1.4rem; color: var(--petrol-d);
  }
  .zurueck {
    display: inline-block; margin-top: 22px; font-family: "Caveat", cursive;
    font-size: 1.15rem; color: var(--tinte-soft); background: none; border: none;
    cursor: pointer; opacity: .8;
  }
  .zurueck:hover { opacity: 1; color: var(--terrakotta-d); }

  #konfetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

  /* ============================================================
     STARTSEITE  –  Date-Frage mit flüchtendem NEIN-Button
     ============================================================ */
  /* aufgeregtes Zappeln/Wackeln der Hype-Tierchen */
  @keyframes zappeln {
    0%,100% { transform: translateY(0)   rotate(-3deg) scale(1); }
    25%     { transform: translateY(-4px) rotate(3deg)  scale(1.04); }
    50%     { transform: translateY(0)   rotate(-2deg) scale(1); }
    75%     { transform: translateY(-3px) rotate(2deg)  scale(1.03); }
  }
  .szene.hype .tier { animation: zappeln .45s ease-in-out infinite; }

  .start { text-align: center; }
  .start .augenbraue { margin-bottom: 2px; }
  .start .frage { margin-bottom: 30px; }

  /* Bühne für die zwei Buttons: relativ, damit NEIN frei springen kann */
  .start-buttons {
    position: relative;
    min-height: 200px;
    margin-top: 6px;
  }
  /* JA bleibt schön mittig und einladend groß */
  .btn-ja {
    font-family: inherit; font-size: 1.35rem; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--terrakotta), var(--terrakotta-d));
    border: none; border-radius: 18px; padding: 18px 64px; cursor: pointer;
    box-shadow: 0 14px 30px -10px rgba(185,84,58,.7);
    transition: transform .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-ja:hover { transform: translateY(-3px) scale(1.05); }
  .btn-ja:active { transform: translateY(0) scale(.98); }

  /* NEIN: kleiner, dezent – und springt weg, sobald man ihn anvisiert */
  .btn-nein {
    font-family: inherit; font-size: 1rem; font-weight: 500; color: var(--tinte-soft);
    background: #fffdf9; border: 1.5px solid rgba(69,56,47,.16);
    border-radius: 14px; padding: 12px 26px; cursor: pointer;
    transition: top .25s cubic-bezier(.34,1.56,.64,1), left .25s cubic-bezier(.34,1.56,.64,1), transform .12s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Sobald der Button „auf der Flucht" ist, wird er absolut positioniert */
  .btn-nein.flieht { position: absolute; }

  /* freche Reaktion, falls NEIN doch erwischt wird */
  .reaktion {
    margin-top: 18px;
    font-family: "Caveat", cursive;
    font-size: 1.45rem;
    color: var(--terrakotta-d);
    min-height: 1.6em;
    opacity: 0;
    transition: opacity .4s ease;
  }
  .reaktion.zeigen { opacity: 1; }

  /* ============================================================
     9) GRÖSSERE BREITEN
     ============================================================ */
  @media (min-width: 600px) {
    .karte  { padding: 44px 44px 38px; }
    .frage  { font-size: 1.7rem; }
    .finale h1 { font-size: 1.95rem; }
    .szene  { gap: 14px; min-height: 96px; }
    .tier   { width: 86px; }
    .tier.vase { width: 78px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .step.sichtbar { animation: none; }
    .option, .ja-button, .tier { transition: none; animation: none; }
  }
</style>
</head>

<body>
  <main class="karte" role="main">
    <div class="fortschritt" id="fortschritt" aria-hidden="true"></div>
    <div id="buehne"></div>
  </main>
  <canvas id="konfetti"></canvas>

<script>
/* ================================================================
   ⚙️  KONFIG
   ================================================================ */
const KONFIG = {
  datum: "am kommenden Wochenende",
  intro: "Ich hätte da eine Idee …",

  /* ----- Startseite (Date-Frage mit flüchtendem NEIN-Button) ----- */
  startBraue:   "Bevor wir anfangen …",
  startFrage:   "Willst du mit mir ein Date haben?",
  startJa:      "JA! 💕",
  startNein:    "Nein",
  /* Freche Sprüche, falls sie den NEIN-Button doch erwischt.
     Es wird der Reihe nach durchgewechselt. Frei änderbar/erweiterbar. */
  neinReaktionen: [
    "Hihi, der Button ist schneller als du 😜",
    "Netter Versuch! Aber „Nein“ steht hier nicht zur Auswahl 😏",
    "Du meinst sicher JA, oder? 🥺",
    "Erwischt! Trotzdem zählt nur das große JA 💕"
  ],
  finaleVorText:  "Bist du bereit für einen Nachmittag voller",
  finaleHighlight: "Keramik-Katastrophen",
  finaleNachText: "gefolgt von",
  jaButtonText:   "JA!",
  belohnungEmoji:    "🏺💕",
  belohnungTitel:    "Date gebucht!",
  belohnungText:     "Du hast soeben offiziell zugesagt. Rückzug zwecklos – " +
                     "es gibt schon einen Tisch in meinem Kopf.",
  gutscheinText:     "🎟️ 1× Gutschein: Ich übernehme die Rechnung & lache nicht (zu laut) über deine Vase.",

  /* ----------------------------------------------------------------
     📧  E-MAIL-BENACHRICHTIGUNG via Formspree (optional)
     ----------------------------------------------------------------
     So aktivierst du die Mail beim Klick auf „JA!":
       1. Auf https://formspree.io kostenlos registrieren.
       2. Neues Formular anlegen -> du bekommst eine Endpunkt-URL
          der Form  https://formspree.io/f/XXXXXXXX
       3. Diese URL unten bei  formspreeEndpoint  eintragen.
     Lässt du den Wert leer (""), wird einfach keine Mail verschickt –
     das Spiel funktioniert trotzdem ganz normal weiter.

     Hinweis: Das läuft im Browser. Wenn deine Frau offline ist, den
     Tab sofort schließt oder einen strengen Blocker nutzt, kommt die
     Mail evtl. nicht an. Für eine Date-Einladung reicht das aber gut. */
  formspreeEndpoint: ""   // z.B. "https://formspree.io/f/abcdwxyz"
};

/* ================================================================
   🎨  TIERE  –  Kawaii-Tierchen als Inline-SVG
   ----------------------------------------------------------------
   Eigene Zeichnungen im niedlichen Sticker-Stil (runde Körper,
   Punkt-Augen, Bäckchen). Pro Seite werden 2–3 davon gezeigt.
   makeAnimal({type, color, face, front, ...}) baut ein Tier.
     type : 'cat' | 'bear' | 'bunny' | 'fox' | 'frog' | 'mouse' | 'pig'
     face : 'happy' | 'love' | 'focus' | 'nervous' | 'dizzy'
     front: zusätzliches SVG VOR dem Körper (Hüte, Essen, Pinsel …)
   ================================================================ */
const OUT = "#4a3a2f";                                   // Outline-Farbe
const S   = `stroke="${OUT}" stroke-width="3" stroke-linejoin="round"`;

function earsSVG(o){
  const C = o.color, IN = o.inner || "#f4a9bd";
  switch(o.type){
    case 'cat': case 'fox':
      return `<path d="M31 52 L34 30 L50 48 Z" fill="${C}" ${S}/>
              <path d="M69 52 L66 30 L50 48 Z" fill="${C}" ${S}/>
              <path d="M36 45 L37 36 L44 45 Z" fill="${IN}"/>
              <path d="M64 45 L63 36 L56 45 Z" fill="${IN}"/>`;
    case 'bear':
      return `<circle cx="33" cy="47" r="10" fill="${C}" ${S}/><circle cx="67" cy="47" r="10" fill="${C}" ${S}/>
              <circle cx="33" cy="47" r="5" fill="${IN}"/><circle cx="67" cy="47" r="5" fill="${IN}"/>`;
    case 'mouse':
      return `<circle cx="32" cy="46" r="12" fill="${C}" ${S}/><circle cx="68" cy="46" r="12" fill="${C}" ${S}/>
              <circle cx="32" cy="46" r="7" fill="${IN}"/><circle cx="68" cy="46" r="7" fill="${IN}"/>`;
    case 'bunny':
      return `<ellipse cx="41" cy="30" rx="7" ry="19" transform="rotate(-10 41 30)" fill="${C}" ${S}/>
              <ellipse cx="59" cy="30" rx="7" ry="19" transform="rotate(10 59 30)" fill="${C}" ${S}/>
              <ellipse cx="41" cy="31" rx="3" ry="13" transform="rotate(-10 41 31)" fill="${IN}"/>
              <ellipse cx="59" cy="31" rx="3" ry="13" transform="rotate(10 59 31)" fill="${IN}"/>`;
    case 'pig':
      return `<path d="M33 52 L30 40 L45 48 Z" fill="${C}" ${S}/><path d="M67 52 L70 40 L55 48 Z" fill="${C}" ${S}/>`;
    default: return "";
  }
}

function faceSVG(o){
  const cheeks = `<ellipse cx="34" cy="83" rx="5.5" ry="3.6" fill="#f4a9bd" opacity=".55"/>
                  <ellipse cx="66" cy="83" rx="5.5" ry="3.6" fill="#f4a9bd" opacity=".55"/>`;
  const muzzle = o.muzzle ? `<ellipse cx="50" cy="82" rx="13" ry="9" fill="#fff"/>` : "";

  if(o.type === 'frog'){
    const pupil = o.face==='focus' ? 3 : 4;
    const eyes = `<circle cx="40" cy="48" r="9" fill="#fff" stroke="${OUT}" stroke-width="2.5"/>
                  <circle cx="60" cy="48" r="9" fill="#fff" stroke="${OUT}" stroke-width="2.5"/>
                  <circle cx="41" cy="49" r="${pupil}" fill="#3a2c22"/><circle cx="61" cy="49" r="${pupil}" fill="#3a2c22"/>
                  <circle cx="39.6" cy="47.6" r="1.3" fill="#fff"/><circle cx="59.6" cy="47.6" r="1.3" fill="#fff"/>`;
    const brows = o.face==='focus'
      ? `<line x1="33" y1="40" x2="44" y2="42" stroke="${OUT}" stroke-width="2.4" stroke-linecap="round"/>
         <line x1="67" y1="40" x2="56" y2="42" stroke="${OUT}" stroke-width="2.4" stroke-linecap="round"/>` : "";
    const mouth = `<path d="M38 86 Q50 96 62 86" stroke="${OUT}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    return muzzle + eyes + brows + cheeks + mouth;
  }

  let eyes, mouth, brows = "";
  switch(o.face){
    case 'love':
      eyes  = `<path d="M36 74 q5 -6 10 0" stroke="${OUT}" stroke-width="3" fill="none" stroke-linecap="round"/>
               <path d="M54 74 q5 -6 10 0" stroke="${OUT}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      mouth = `<path d="M44 84 Q50 91 56 84" stroke="${OUT}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      break;
    case 'focus':
      brows = `<line x1="36" y1="66" x2="46" y2="69" stroke="${OUT}" stroke-width="2.6" stroke-linecap="round"/>
               <line x1="64" y1="66" x2="54" y2="69" stroke="${OUT}" stroke-width="2.6" stroke-linecap="round"/>`;
      eyes  = `<circle cx="42" cy="73" r="3.4" fill="#3a2c22"/><circle cx="58" cy="73" r="3.4" fill="#3a2c22"/>`;
      mouth = `<path d="M46 85 L54 85" stroke="${OUT}" stroke-width="2.6" stroke-linecap="round"/>`;
      break;
    case 'nervous':
      eyes  = `<circle cx="42" cy="72" r="4.4" fill="#3a2c22"/><circle cx="58" cy="72" r="4.4" fill="#3a2c22"/>
               <circle cx="40.7" cy="70.5" r="1.3" fill="#fff"/><circle cx="56.7" cy="70.5" r="1.3" fill="#fff"/>`;
      mouth = `<path d="M45 86 q3 -3 5 0 q2 3 5 0" stroke="${OUT}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
      break;
    case 'dizzy':
      eyes  = `<path d="M38 69 L46 76 M46 69 L38 76" stroke="${OUT}" stroke-width="2.6" stroke-linecap="round"/>
               <path d="M54 69 L62 76 M62 69 L54 76" stroke="${OUT}" stroke-width="2.6" stroke-linecap="round"/>`;
      mouth = `<circle cx="50" cy="87" r="2.6" fill="none" stroke="${OUT}" stroke-width="2.4"/>`;
      break;
    case 'excited':
      // große, glänzende Sterne-Augen + weit offener Freuden-Mund
      eyes  = `<circle cx="42" cy="72" r="6" fill="#3a2c22"/><circle cx="58" cy="72" r="6" fill="#3a2c22"/>
               <circle cx="39.8" cy="69.8" r="2" fill="#fff"/><circle cx="55.8" cy="69.8" r="2" fill="#fff"/>
               <circle cx="44" cy="74" r="1" fill="#fff"/><circle cx="60" cy="74" r="1" fill="#fff"/>`;
      mouth = `<path d="M43 83 Q50 93 57 83 Q50 87 43 83 Z" fill="#b5485e" stroke="${OUT}" stroke-width="2.2" stroke-linejoin="round"/>`;
      break;
    default: // happy
      eyes  = `<circle cx="42" cy="72" r="4.6" fill="#3a2c22"/><circle cx="58" cy="72" r="4.6" fill="#3a2c22"/>
               <circle cx="40.6" cy="70.4" r="1.4" fill="#fff"/><circle cx="56.6" cy="70.4" r="1.4" fill="#fff"/>`;
      mouth = `<path d="M45 84 Q50 89 55 84" stroke="${OUT}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  }
  return muzzle + brows + eyes + cheeks + mouth;
}

function makeAnimal(o){
  const belly = o.belly ? `<ellipse cx="50" cy="84" rx="15" ry="17" fill="${o.belly}"/>` : "";
  const body  = `<rect x="26" y="48" width="48" height="56" rx="24" fill="${o.color}" ${S}/>`;
  return `<svg class="tier" viewBox="0 0 100 122" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">`
       + (o.behind || "") + earsSVG(o) + body + belly + faceSVG(o) + (o.front || "")
       + `</svg>`;
}

/* --- die einzelnen Tierchen (per Schlüssel abrufbar) --- */
const TIERE = {
  /* Seite 1 – Herausforderung / blamieren */
  foxFlex: () => makeAnimal({ type:'cat', color:'#d8744f', inner:'#f4c4b0', muzzle:true, face:'happy',
    front:`<path d="M28 74 Q22 66 24 60" stroke="#d8744f" stroke-width="7" fill="none" stroke-linecap="round"/>
           <ellipse cx="22" cy="59" rx="6.5" ry="7.5" fill="#d8744f" ${S}/>
           <path d="M15 50 l2 4 l4 2 l-4 2 l-2 4 l-2 -4 l-4 -2 l4 -2 Z" fill="#f0c987"/>` }),
  bunnyNervous: () => makeAnimal({ type:'bunny', color:'#f3e7d8', inner:'#f4c4cf', face:'nervous',
    front:`<path d="M73 54 q4 7 0 11 q-4 -4 0 -11 Z" fill="#9bd4ec" stroke="#5aa6c9" stroke-width="1.5"/>
           <ellipse cx="36" cy="100" rx="6" ry="6.5" fill="#f3e7d8" ${S}/>
           <ellipse cx="64" cy="100" rx="6" ry="6.5" fill="#f3e7d8" ${S}/>` }),
  catCheer: () => makeAnimal({ type:'cat', color:'#cfd6da', inner:'#f4c4cf', face:'love',
    front:`<path d="M70 56 q3 -4 6 0 q3 -4 6 0 q0 5 -6 9 q-6 -4 -6 -9 Z" fill="#e0607a"/>` }),

  /* Seite 2 – Vibe / Dreck */

/* Baut eine Tier-Szene aus einer Liste von Schlüsseln */
function szeneHTML(keys){
  if(!keys || !keys.length) return "";
  return `<div class="szene">` + keys.map(k => (TIERE[k] ? TIERE[k]() : "")).join("") + `</div>`;
}

/* ================================================================
   🎬  ABLAUF-LOGIK
   ================================================================ */
const buehne      = document.getElementById("buehne");
const fortschritt = document.getElementById("fortschritt");
let index = 0;
const PUNKTE_GESAMT = FRAGEN.length + 1;

function punkteAufbauen(){
  fortschritt.innerHTML = "";
  for(let i=0;i<PUNKTE_GESAMT;i++){
    const p = document.createElement("span");
    p.className = "punkt";
    fortschritt.appendChild(p);
  }
}
function punkteAktualisieren(aktiv){
  [...fortschritt.children].forEach((p,i)=>{
    p.classList.toggle("fertig", i < aktiv);
    p.classList.toggle("aktiv",  i === aktiv);
  });
}

function frageZeigen(frage, schrittNr){
  const optionenHtml = frage.optionen.map((opt,i)=>
    `<button class="option" data-i="${i}">${opt.label}</button>`).join("");
  buehne.innerHTML = `
    <section class="step sichtbar">
      ${szeneHTML(frage.szene)}
      ${frage.braue ? `<div class="augenbraue">${frage.braue}</div>` : ""}
      <h2 class="frage">${frage.text}</h2>
      <div class="optionen">${optionenHtml}</div>
    </section>`;
  punkteAktualisieren(schrittNr);
  buehne.querySelectorAll(".option").forEach(btn=>{
    btn.addEventListener("click", ()=> auswahlVerarbeiten(frage.optionen[Number(btn.dataset.i)]));
  });
}

function auswahlVerarbeiten(opt){
  if(opt.ziel === "finale"){
    finaleZeigen(opt.ergebnis);
  } else if(opt.ziel === "essen"){
    frageZeigen(ESSEN, FRAGEN.length - 1);   // gleicher Fortschrittspunkt wie Frage 4
  } else {
    index++;
    frageZeigen(FRAGEN[index], index);
  }
}

let letzteWahl = "";   // merkt sich die Auswahl aus Schritt 4 für die E-Mail

function finaleZeigen(ergebnis){
  letzteWahl = ergebnis;

}

/* Schickt – falls in KONFIG ein Formspree-Endpunkt hinterlegt ist –
   eine Mail mit der getroffenen Wahl. „Feuern und vergessen": Wir warten
   bewusst nicht auf die Antwort, damit die Belohnung sofort erscheint.
   Schlägt der Versand fehl, läuft das Spiel trotzdem normal weiter. */
function benachrichtigungSenden(){
  const url = KONFIG.formspreeEndpoint;
  if(!url) return;   // kein Endpunkt -> nichts tun

  // Klartext-Wahl ohne Emojis (für eine saubere Betreffzeile/Mail)
  const wahlText = letzteWahl.replace(/[^\p{L}\p{N}\s\-]/gu, "").trim() || letzteWahl;

  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      betreff: "🎉 Sie hat JA gesagt!",
      nachricht: "Die Date-Einladung wurde angenommen.",
      auswahl: wahlText,                       // z.B. "Pizza" oder "Kino-Popcorn-Koma"
      zeitpunkt: new Date().toLocaleString("de-DE"),
      _subject: "🎉 Date-Einladung angenommen: " + wahlText
    })
  }).catch(() => { /* Netzwerkfehler bewusst ignorieren */ });
}

   ----------------------------------------------------------------
   JA  -> startet den Fragen-Pfad.

          Wird er doch erwischt, erscheint eine freche Reaktion.
   ================================================================ */
let neinReaktionIndex = 0;   // welcher Spruch ist als Nächstes dran

function startseiteZeigen(){
  punkteAktualisieren(-1);   // noch kein Fortschrittspunkt aktiv

  buehne.innerHTML = `
    <section class="step sichtbar start">
      <div class="szene hype">
        ${TIERE.hypeFox()}
        ${TIERE.hypeBear()}
      </div>
      <div class="augenbraue">${KONFIG.startBraue}</div>
      <h2 class="frage">${KONFIG.startFrage}</h2>
      <div class="start-buttons" id="startButtons">
        <button class="btn-ja"   id="btnJa">${KONFIG.startJa}</button>
        <button class="btn-nein" id="btnNein">${KONFIG.startNein}</button>
      </div>
      <div class="reaktion" id="reaktion"></div>
    </section>`;

  const buehneBox = document.getElementById("startButtons");
  const btnNein   = document.getElementById("btnNein");
  const reaktion  = document.getElementById("reaktion");

  // JA -> los geht's
  document.getElementById("btnJa").addEventListener("click", neuStarten);

  /* Lässt den NEIN-Button an eine zufällige freie Stelle springen –
     und meidet dabei den Bereich des JA-Buttons. */
  function wegspringen(){
    const feld = buehneBox.getBoundingClientRect();
    const b    = btnNein.getBoundingClientRect();
    btnNein.classList.add("flieht");
    const maxX = Math.max(0, feld.width  - b.width);
    const maxY = Math.max(0, feld.height - b.height);

    // JA-Button-Rechteck relativ zum Feld (Sperrzone mit etwas Puffer)
    const ja  = document.getElementById("btnJa").getBoundingClientRect();
    const sperr = {
      x1: ja.left - feld.left - 12, y1: ja.top  - feld.top - 12,
      x2: ja.right - feld.left + 12, y2: ja.bottom - feld.top + 12
    };

    // bis zu 20 Versuche, eine Position außerhalb der JA-Zone zu finden
    let x = 0, y = 0;
    for(let i=0;i<20;i++){
      x = Math.random()*maxX;
      y = Math.random()*maxY;
      const ueberlappt = x < sperr.x2 && x + b.width  > sperr.x1 &&
                         y < sperr.y2 && y + b.height > sperr.y1;
      if(!ueberlappt) break;
    }
    btnNein.style.left = x + "px";
    btnNein.style.top  = y + "px";
  }

  /* Freche Reaktion anzeigen (rotierend durch die Sprüche). */
  function reaktionZeigen(){
    const sprueche = KONFIG.neinReaktionen;
    reaktion.textContent = sprueche[neinReaktionIndex % sprueche.length];
    reaktion.classList.add("zeigen");
    neinReaktionIndex++;
  }

  // Maus: schon beim Drüberfahren flüchten
  btnNein.addEventListener("mouseenter", wegspringen);
  // Touch/Finger: beim Antippen ausweichen, bevor der Klick zählt
  btnNein.addEventListener("touchstart", (e)=>{ e.preventDefault(); wegspringen(); reaktionZeigen(); }, { passive:false });
  // Tastatur/Fokus: auch hier ausweichen
  btnNein.addEventListener("focus", wegspringen);
  // Falls sie ihn per Maus-Klick doch erwischt: freche Reaktion + weiterspringen
  btnNein.addEventListener("click", (e)=>{ e.preventDefault(); reaktionZeigen(); wegspringen(); });
}

/* ================================================================
   🎉  KONFETTI
   ================================================================ */
function konfettiStarten(){
  const canvas = document.getElementById("konfetti");
  const ctx = canvas.getContext("2d");
  let breite, hoehe;
  function groesse(){ breite = canvas.width = window.innerWidth; hoehe = canvas.height = window.innerHeight; }
  groesse(); window.addEventListener("resize", groesse);

  const farben = ["#d8744f","#3f7d78","#f0c987","#e8b4a0","#9ec7c2","#b9543a"];
  const teilchen = Array.from({length:140}, ()=>({
    x: Math.random()*breite, y: Math.random()*-hoehe,
    r: 5+Math.random()*7, farbe: farben[Math.floor(Math.random()*farben.length)],
    vx: -1.5+Math.random()*3, vy: 2+Math.random()*3.5,
    dreh: Math.random()*Math.PI, drehV: -0.1+Math.random()*0.2
  }));
  const start = performance.now();
  const DAUER = 2600;
  function zeichnen(jetzt){
    const vergangen = jetzt - start;
    ctx.clearRect(0,0,breite,hoehe);
    teilchen.forEach(t=>{
      t.x += t.vx; t.y += t.vy; t.dreh += t.drehV;
      if(t.y > hoehe+20 && vergangen < DAUER){ t.y = -20; t.x = Math.random()*breite; }
      ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.dreh);
      ctx.fillStyle = t.farbe; ctx.fillRect(-t.r/2,-t.r/2,t.r,t.r*0.6); ctx.restore();
    });
    if(vergangen < DAUER+1500) requestAnimationFrame(zeichnen);
    else ctx.clearRect(0,0,breite,hoehe);
  }
  requestAnimationFrame(zeichnen);
}

/* ================================================================
   ▶️  START
   ================================================================ */
punkteAufbauen();
startseiteZeigen();   // zuerst die Date-Frage, dann (bei JA) der Fragen-Pfad
